# fly.io deployment — single machine keeps the scheduler single-instance
app = "betarena"
primary_region = "cdg"

[build]

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  count = 1
